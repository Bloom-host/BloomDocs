<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">MOTD creator server.properties output</title>
  <desc id="desc">An example Minecraft MOTD preview with the generated server.properties value.</desc>
  <rect width="960" height="360" rx="18" fill="#151a2d"/>
  <text x="42" y="55" fill="#fff" font-family="Arial, sans-serif" font-size="26" font-weight="700">MOTD creator</text>
  <rect x="42" y="86" width="876" height="105" rx="12" fill="#252c45"/>
  <rect x="64" y="108" width="64" height="64" rx="8" fill="#f9c511"/>
  <text x="151" y="137" fill="#fff" font-family="Arial, sans-serif" font-size="22" font-weight="700">A Minecraft Server</text>
  <text x="151" y="166" fill="#ff7b7b" font-family="Arial, sans-serif" font-size="18">Welcome to our world!</text>
  <text x="42" y="235" fill="#b8c5e8" font-family="Arial, sans-serif" font-size="16">For official/vanilla server.properties:</text>
  <rect x="42" y="254" width="876" height="66" rx="10" fill="#0d1120"/>
  <text x="62" y="295" fill="#dce6ff" font-family="Consolas, monospace" font-size="19">motd=A Minecraft Server \u00A7cWelcome to our world!</text>
</svg>
